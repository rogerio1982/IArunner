<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — AI Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>[hidden] { display: none !important; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

<main class="max-w-md mx-auto px-6 py-16">
    <a href="/views/index.html" class="text-lime-400 font-extrabold text-xl">AI Runner</a>
    <h1 class="mt-6 text-2xl font-bold">Entrar</h1>

    <div id="errors" class="mt-4 bg-red-950 border border-red-700 text-red-300 rounded-lg p-3 text-sm" hidden></div>

    <form id="login-form" class="mt-6 space-y-4">
        <div>
            <label class="block text-sm text-slate-300 mb-1">E-mail</label>
            <input type="email" name="email" required
                class="w-full rounded-lg bg-slate-900 border border-slate-700 px-4 py-2 focus:outline-none focus:border-lime-400">
        </div>
        <div>
            <label class="block text-sm text-slate-300 mb-1">Senha</label>
            <input type="password" name="password" required
                class="w-full rounded-lg bg-slate-900 border border-slate-700 px-4 py-2 focus:outline-none focus:border-lime-400">
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-lime-400 text-slate-950 font-semibold hover:bg-lime-300">
            Entrar
        </button>
    </form>

    <p class="mt-4 text-sm text-slate-400">Não tem conta? <a href="/views/cadastro.html" class="text-lime-400">Criar conta</a></p>
</main>

<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
